name: Build & test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Debug APK (debug-signed, for testing only)
        run: ./gradlew assembleDebug --stacktrace -PUPDATE_REPO_OWNER=${{ github.repository_owner }} -PUPDATE_REPO_NAME=${{ github.event.repository.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
      # GitHub Actions artifacts are always downloaded as ZIP files. Publish a
      # separate direct .apk asset so Android users can tap Install immediately.
      - name: Publish direct APK download (nightly testing build)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: StickerStudio Nightly (testing only)
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: app/build/outputs/apk/debug/*.apk
          body: |
            Automatic debug build for testing only.
            Download the .apk asset directly; do not download the source code ZIP.
            This is not an official production release.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
