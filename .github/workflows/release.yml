name: Release

# Push a tag like v1.0.0 (must equal APP_VERSION_NAME in gradle.properties).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (example: 1.0.29)'
        required: true
        type: string
      version_code:
        description: 'Version code (must be higher than current, example: 29)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STICKER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      STICKER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      STICKER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
      UPDATES_REPO_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate release and prepare version tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          for v in KEYSTORE_BASE64 STICKER_KEYSTORE_PASSWORD STICKER_KEY_ALIAS STICKER_KEY_PASSWORD UPDATES_REPO_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is missing. See docs/RELEASING.md"; exit 1; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CURRENT_VERSION_NAME=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          CURRENT_VERSION_CODE=$(grep '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2)

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::Run manual releases from main."; exit 1; fi
            VERSION_NAME="$INPUT_VERSION_NAME"
            VERSION_CODE="$INPUT_VERSION_CODE"
            if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Use version format 1.0.29"; exit 1; fi
            if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then echo "::error::Version code must be a positive integer."; exit 1; fi
            if [ "$VERSION_CODE" -lt "$CURRENT_VERSION_CODE" ]; then echo "::error::Version code cannot be lower than current $CURRENT_VERSION_CODE."; exit 1; fi
            if [ "$VERSION_CODE" -eq "$CURRENT_VERSION_CODE" ] && [ "$VERSION_NAME" != "$CURRENT_VERSION_NAME" ]; then echo "::error::Version code $VERSION_CODE is already assigned to $CURRENT_VERSION_NAME."; exit 1; fi
            RELEASE_TAG="v$VERSION_NAME"
            git fetch --tags
            if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then echo "::error::Tag $RELEASE_TAG already exists."; exit 1; fi
            if [ "$VERSION_CODE" -gt "$CURRENT_VERSION_CODE" ]; then
              python3 - "$VERSION_NAME" "$VERSION_CODE" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("gradle.properties")
          s = p.read_text()
          s, a = re.subn(r"(?m)^APP_VERSION_NAME=.*$", f"APP_VERSION_NAME={sys.argv[1]}", s)
          s, b = re.subn(r"(?m)^APP_VERSION_CODE=.*$", f"APP_VERSION_CODE={sys.argv[2]}", s)
          if a != 1 or b != 1: raise SystemExit("Could not safely update app version properties")
          p.write_text(s)
          PY
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add gradle.properties
              git commit -m "chore: release $RELEASE_TAG"
              git push origin HEAD:main
            else
              echo "Using the version already prepared on main: $VERSION_NAME ($VERSION_CODE)"
            fi
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          else
            VERSION_NAME="$CURRENT_VERSION_NAME"
            VERSION_CODE="$CURRENT_VERSION_CODE"
            RELEASE_TAG="$GITHUB_REF_NAME"
            if [ "$RELEASE_TAG" != "v$VERSION_NAME" ]; then echo "::error::Tag $RELEASE_TAG != v$VERSION_NAME (gradle.properties)"; exit 1; fi
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Restore keystore (never printed)
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "STICKER_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Signed release APK
        run: ./gradlew assembleRelease --stacktrace -PUPDATE_REPO_OWNER=Deeper1deep -PUPDATE_REPO_NAME=StickerStudio-Updates

      - name: Verify signature and prepare assets
        run: |
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK_SRC" | tee "$RUNNER_TEMP/certs.txt"
          CERT=$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}')
          echo "Signing certificate SHA-256: $CERT"
          if [ -n "$EXPECTED_CERT_SHA256" ] && [ "$(echo "$EXPECTED_CERT_SHA256" | tr 'A-F' 'a-f')" != "$CERT" ]; then
            echo "::error::Signing certificate differs from EXPECTED_CERT_SHA256. Wrong key? Updates over the old app would fail."; exit 1
          fi
          mkdir -p dist
          APK="dist/StickerStudio-${VERSION_NAME}.apk"
          cp "$APK_SRC" "$APK"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK")
          echo "$SHA  StickerStudio-${VERSION_NAME}.apk" > "$APK.sha256"
          python3 - <<PY
          import json, os, datetime
          # Release notes: the "## <version>" section of CHANGELOG.md (shown in the app's update popup).
          notes = ""
          try:
              out = []
              on = False
              for line in open("CHANGELOG.md", encoding="utf-8").read().splitlines():
                  if line.startswith("## "):
                      if on:
                          break
                      on = line.startswith("## " + os.environ["VERSION_NAME"])
                      continue
                  if on:
                      out.append(line)
              notes = chr(10).join(out).strip()
          except OSError:
              pass
          json.dump({
            "versionName": os.environ["VERSION_NAME"],
            "versionCode": int(os.environ["VERSION_CODE"]),
            "apkUrl": "https://github.com/Deeper1deep/StickerStudio-Updates/releases/download/" + os.environ["RELEASE_TAG"] + "/StickerStudio-" + os.environ["VERSION_NAME"] + ".apk",
            "sha256": "$SHA",
            "sizeBytes": $SIZE,
            "applicationId": "com.stickerstudio.app",
            "publishedAt": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
            "changelog": notes or "See release notes"
          }, open("dist/update.json", "w"), indent=2)
          PY
          cat dist/update.json

      - name: Publish public update release
        uses: softprops/action-gh-release@v2
        with:
          repository: Deeper1deep/StickerStudio-Updates
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: main
          token: ${{ secrets.UPDATES_REPO_TOKEN }}
          files: |
            dist/*.apk
            dist/*.sha256
            dist/update.json
          generate_release_notes: true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
