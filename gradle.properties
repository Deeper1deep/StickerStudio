org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Release identity.
#   * APP_VERSION_CODE MUST increase on every published release, otherwise
#     Android refuses to install the new APK over the old one.
#   * applicationId (com.stickerstudio.app) lives in app/build.gradle.kts and
#     must NEVER change once users have installed the app.
# ---------------------------------------------------------------------------
APP_VERSION_NAME=1.0.33
APP_VERSION_CODE=33

# ---------------------------------------------------------------------------
# GitHub repository used by the in-app updater (GitHub Releases).
# Put your own account / repo here, or override from the command line:
#   ./gradlew assembleRelease -PUPDATE_REPO_OWNER=me -PUPDATE_REPO_NAME=StickerStudio-Updates
# While UPDATE_REPO_OWNER is empty the updater reports "not configured".
# Do NOT put tokens here: the repository must be public and no token is used.
# ---------------------------------------------------------------------------
UPDATE_REPO_OWNER=Deeper1deep
UPDATE_REPO_NAME=StickerStudio
